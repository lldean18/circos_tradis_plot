
show_ticks          = yes
show_tick_labels    = yes

<ticks>
skip_first_label = no
skip_last_label  = no
radius           = dims(ideogram,radius_outer)
tick_separation  = 3p
label_separation = 1p
multiplier       = 1e-6
color            = black
thickness        = 4p
size             = 20p

<tick>
spacing        = 10000
show_label     = no
thickness      = 3p
color          = dgrey
</tick>

<tick>
spacing        = 500000
show_label     = yes
label_size     = 20p
label_offset   = 10p
suffix         = Mb
format         = %.1f
thickness      = 5p
color          = vdgrey
</tick>

<tick>
spacing        = 1000000
show_label     = yes
label_size     = 26p
label_offset   = 10p
suffix         = Mb
format         = %d
grid           = yes
grid_color     = dgrey
grid_thickness = 1p
grid_start     = 0.5r
grid_end       = 0.999r
</tick>

</ticks>
